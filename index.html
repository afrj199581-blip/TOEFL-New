<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>TOEFL Listening</title>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #0d1720;

    color: white;

}


/* =========================
   HEADER
========================= */

.header {

    background: linear-gradient(135deg, #123746, #1d6170);

    padding: 30px 20px;

    text-align: center;

    border-bottom-left-radius: 35px;

    border-bottom-right-radius: 35px;

}

.header h1 {

    margin: 0;

    font-size: 34px;

}

.header p {

    margin-top: 10px;

    font-size: 18px;

    opacity: .9;

}


/* =========================
   CONTAINER
========================= */

.container {

    max-width: 700px;

    margin: auto;

    padding: 20px 15px 60px;

}


/* =========================
   SECTION TITLE
========================= */

.section-title {

    font-size: 28px;

    font-weight: bold;

    margin: 20px 5px;

}


/* =========================
   LESSON
========================= */

.lesson {

    background: white;

    color: #17232b;

    border-radius: 25px;

    padding: 15px;

    margin-bottom: 30px;

    box-shadow: 0 8px 25px rgba(0,0,0,.3);

}


.lesson-title {

    font-size: 27px;

    font-weight: bold;

    margin-bottom: 15px;

}


/* =========================
   VIDEO
========================= */

.video {

    width: 100%;

    border-radius: 18px;

    background: black;

    display: block;

}


/* =========================
   FILE TITLE
========================= */

.file-title {

    background: #214e5d;

    color: white;

    font-size: 21px;

    font-weight: bold;

    padding: 14px;

    margin-top: 18px;

    border-radius: 16px 16px 0 0;

    text-align: center;

}


/* =========================
   FILE FRAME
========================= */

.file-frame {

    width: 100%;

    border: none;

    display: block;

    background: white;

}


/* =========================
   PDF
   حوالي ثلث الشاشة
========================= */

.pdf-frame {

    height: 34vh;

    min-height: 220px;

    max-height: 320px;

    border-radius: 0 0 16px 16px;

    overflow: auto;

}


/* =========================
   EXPLANATION
========================= */

.explanation-frame {

    height: 34vh;

    min-height: 220px;

    max-height: 320px;

    border-radius: 0 0 16px 16px;

    overflow: auto;

}


/* =========================
   RESOURCES
========================= */

.resources {

    background: white;

    color: #17232b;

    border-radius: 25px;

    padding: 15px;

    margin-top: 25px;

}


.resource-title {

    font-size: 23px;

    font-weight: bold;

    margin-bottom: 12px;

}


/* =========================
   FOOTER
========================= */

.footer {

    text-align: center;

    opacity: .6;

    margin-top: 35px;

    font-size: 14px;

}


</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <h1>🎧 TOEFL</h1>

    <p>Listening Practice</p>

</div>



<div class="container">


<div class="section-title">

    🎧 Listening

</div>



<!-- ================================================= -->
<!-- LISTENING 1 -->
<!-- ================================================= -->

<div class="lesson">


    <div class="lesson-title">

        🎧 Listening 1

    </div>



    <!-- VIDEO -->

    <video
        class="video"
        controls
        preload="metadata">

        <source
            src="listen1.mp4"
            type="video/mp4">

        Your browser does not support video playback.

    </video>



    <!-- =========================
         TOEFL BOOK
    ========================= -->

    <div class="file-title">

        📕 TOEFL Book 2

    </div>


    <iframe

        id="pdf1"

        class="file-frame pdf-frame"

        loading="lazy">

    </iframe>



    <!-- =========================
         EXPLANATION
    ========================= -->

    <div class="file-title">

        📄 Listening 1 Explanation

    </div>


    <iframe

        class="file-frame explanation-frame"

        src="listen1Ex.html"

        loading="lazy">

    </iframe>


</div>



<!-- ================================================= -->
<!-- LISTENING 2 -->
<!-- ================================================= -->

<div class="lesson">


    <div class="lesson-title">

        🎧 Listening 2

    </div>



    <!-- VIDEO -->

    <video

        class="video"

        controls

        preload="metadata">

        <source

            src="listen2.mp4"

            type="video/mp4">

        Your browser does not support video playback.

    </video>



    <!-- =========================
         TOEFL BOOK
    ========================= -->

    <div class="file-title">

        📕 TOEFL Book 2

    </div>


    <iframe

        id="pdf2"

        class="file-frame pdf-frame"

        loading="lazy">

    </iframe>



    <!-- =========================
         EXPLANATION
    ========================= -->

    <div class="file-title">

        📄 Listening 2 Explanation

    </div>


    <iframe

        class="file-frame explanation-frame"

        src="listen2Ex.html"

        loading="lazy">

    </iframe>


</div>



<!-- ================================================= -->
<!-- GENERAL RESOURCES -->
<!-- ================================================= -->

<div class="section-title">

    📚 Resources

</div>


<div class="resources">


    <div class="resource-title">

        📕 TOEFL Book 2

    </div>


    <iframe

        id="pdf3"

        class="file-frame pdf-frame"

        loading="lazy">

    </iframe>



    <div
        class="resource-title"
        style="margin-top:25px;">

        📄 TOEFL Book 2 Explanation

    </div>


    <iframe

        class="file-frame explanation-frame"

        src="TOEFLBEx.html"

        loading="lazy">

    </iframe>


</div>



<div class="footer">

    TOEFL Practice • Pharmacy D

</div>


</div>



<!-- ================================================= -->
<!-- PDF VIEWER
================================================= -->

<script>

const pdfFile = "TOEFLBook2.pdf";

const pdfViewer =
"https://mozilla.github.io/pdf.js/web/viewer.html?file="
+
encodeURIComponent(
    window.location.href.substring(
        0,
        window.location.href.lastIndexOf("/") + 1
    )
    + pdfFile
);


/* PDF 1 */

document.getElementById("pdf1").src = pdfViewer;


/* PDF 2 */

document.getElementById("pdf2").src = pdfViewer;


/* PDF 3 */

document.getElementById("pdf3").src = pdfViewer;

</script>


</body>

</html>
