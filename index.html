<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TOEFL</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d1720;
    color: white;
}

.header {
    background: linear-gradient(135deg, #123746, #1d6170);
    padding: 30px 20px;
    text-align: center;
    border-bottom-left-radius: 30px;
    border-bottom-right-radius: 30px;
}

.header h1 {
    margin: 0;
    font-size: 34px;
}

.header p {
    margin-top: 8px;
    font-size: 16px;
    opacity: 0.9;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 25px 15px 50px;
}

.section-title {
    font-size: 25px;
    margin: 25px 5px 15px;
    font-weight: bold;
}

.card {
    background: #ffffff;
    color: #16232b;
    border-radius: 18px;
    margin-bottom: 15px;
    padding: 18px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

.card h2 {
    margin: 0 0 15px;
    font-size: 22px;
}

.button {
    display: block;
    text-decoration: none;
    color: white;
    background: #176b87;
    padding: 15px;
    margin-top: 10px;
    border-radius: 12px;
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    transition: 0.2s;
}

.button:hover {
    transform: scale(1.02);
    background: #0e526a;
}

.video-box {
    margin-top: 12px;
}

video {
    width: 100%;
    border-radius: 12px;
    background: black;
}

.resources .button {
    background: #344e5c;
}

.footer {
    text-align: center;
    opacity: 0.6;
    font-size: 14px;
    margin-top: 30px;
}

</style>
</head>

<body>

<div class="header">

    <h1>🎧 TOEFL</h1>

    <p>Listening Practice</p>

</div>


<div class="container">


    <!-- ========================= -->
    <!-- LISTENING SECTION -->
    <!-- ========================= -->

    <div class="section-title">
        🎧 Listening
    </div>


    <!-- LISTENING 1 -->

    <div class="card">

        <h2>🎧 Listening 1</h2>

        <div class="video-box">

            <video controls preload="metadata">

                <source src="listen1.mp4" type="video/mp4">

                Your browser does not support video playback.

            </video>

        </div>


        <a class="button" href="TOEFLBook2.pdf" target="_blank">
            📕 TOEFL Book 2
        </a>


        <a class="button" href="listen1Ex.html" target="_blank">
            📄 Listening 1 Explanation
        </a>

    </div>



    <!-- LISTENING 2 -->

    <div class="card">

        <h2>🎧 Listening 2</h2>

        <div class="video-box">

            <video controls preload="metadata">

                <source src="listen2.mp4" type="video/mp4">

                Your browser does not support video playback.

            </video>

        </div>


        <a class="button" href="TOEFLBook2.pdf" target="_blank">
            📕 TOEFL Book 2
        </a>


        <a class="button" href="listen2Ex.html" target="_blank">
            📄 Listening 2 Explanation
        </a>

    </div>



    <!-- ========================= -->
    <!-- RESOURCES -->
    <!-- ========================= -->

    <div class="section-title">
        📚 Resources
    </div>


    <div class="card resources">

        <h2>📚 General Resources</h2>


        <a class="button" href="TOEFLBook2.pdf" target="_blank">
            📕 TOEFL Book 2
        </a>


        <a class="button" href="TOEFLBEx.html" target="_blank">
            📄 TOEFL Book 2 Explanation
        </a>

    </div>


    <div class="footer">

        TOEFL Practice • Pharmacy D

    </div>

</div>

</body>
</html>
